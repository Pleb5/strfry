db = "/var/lib/strfry/db"

dbParams {
    maxreaders = 128
    mapsize = 10995116277760
    noReadAhead = false
}

events {
    maxEventSize = 65536
    rejectEventsNewerThanSeconds = 900
    rejectEventsOlderThanSeconds = 31536000
    rejectEphemeralEventsOlderThanSeconds = 60
    ephemeralEventsLifetimeSeconds = 300
    maxNumTags = 2000
    maxTagValSize = 1024
}

relay {
    bind = "0.0.0.0"
    port = 7777
    nofiles = 65536
    realIpHeader = "x-real-ip"

    auth {
        enabled = false
        serviceUrl = ""
        # AUTH proof age, independent of ordinary ephemeral event recency.
        maxAgeSeconds = 600
    }

    # Default-off. Enabling is a coordinated, restart-required deployment:
    # set AUTH enabled + exact wss serviceUrl, disable Negentropy below, set
    # BUDABIT_READ_CONTROL=members, one BUDABIT_BRANCHES, no auto-host/dry-run.
    # Run check-read-control.py --config-only before starting. See RUNBOOK.md.
    readPolicy {
        # Private preset: /usr/local/lib/strfry/read-policy.py
        plugin = ""
        timeoutSeconds = 2
        recheckSeconds = 5
        maxPending = 1024
        maxConnections = 4096
    }

    info {
        name = "Budabit Community Relay"
        description = "Public test relay for the Budabit community. NIP-42 authentication is disabled and ordinary events are retained for one year."
        pubkey = ""
        self = ""
        contact = ""
        icon = ""
        banner = ""
        privacy = ""
        terms = ""
        nips = ""

        # Extra NIP-11 fields. The Budabit write-control plugin is advertised here so
        # clients and auditors can see which branches this relay enforces; keep it in
        # sync with BUDABIT_BRANCHES in compose.yaml. Example:
        # extra = "{\"budabit\":{\"policy_version\":\"1\",\"enforced_branches\":[\"32222:<owner>:<communityId>\"]}}"
        # In private mode use ONLY:
        # extra = "{\"budabit\":{\"read_control\":{\"version\":2,\"mode\":\"members\",\"scope\":\"relay\",\"unfiltered_kinds\":[1,5,1984,30000,32222]}}}"
        extra = ""
    }

    maxWebsocketPayloadSize = 131072
    maxReqFilterSize = 5
    autoPingSeconds = 55
    enableTcpKeepalive = true
    queryTimesliceBudgetMicroseconds = 10000
    maxFilterLimit = 200
    maxTagsPerFilter = 3
    maxFilterLimitCount = 0
    maxSubsPerConnection = 10
    maxPendingOutboundBytes = 4194304

    writePolicy {
        plugin = "/usr/local/lib/strfry/write-policy.py"
        timeoutSeconds = 5
    }

    compression {
        enabled = true
        slidingWindow = false
    }

    logging {
        dumpInAll = false
        dumpInEvents = false
        dumpInReqs = false
        dbScanPerf = false
        invalidEvents = true
    }

    numThreads {
        ingester = 1
        reqWorker = 1
        reqMonitor = 1
        negentropy = 1
    }

    negentropy {
        enabled = true
        maxSyncEvents = 10000
    }

    filterValidation {
        enabled = true
        maxFiltersPerReq = 5
        minFiltersPerReq = 1
        maxKindsPerFilter = 10
        allowedKinds = ""
        requireAuthorOrTag = false
    }
}
