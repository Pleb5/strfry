name: budabit-strfry

services:
  relay:
    image: ${STRFRY_IMAGE:-budabit/strfry:local-read-control}
    pull_policy: build
    build:
      context: ../..
      dockerfile: deploy/budabit/Dockerfile
      args:
        SOURCE_REVISION: "${STRFRY_SOURCE_REVISION:-local-unreleased}"
    entrypoint: ["/sbin/tini", "--", "/usr/local/lib/strfry/start-relay.sh"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:7777:7777"
    volumes:
      - type: bind
        source: ${STRFRY_DATA_DIR:-/var/lib/strfry/db}
        target: /var/lib/strfry/db
        bind:
          create_host_path: false
      - type: bind
        source: ${STRFRY_CONFIG_FILE:-./strfry.conf}
        target: /etc/strfry.conf
        read_only: true
        bind:
          create_host_path: false
    environment:
      STRFRY_CONFIG: /etc/strfry.conf
      PYTHONDONTWRITEBYTECODE: "1"
      STRFRY_POLICY_DB_FILE: /var/lib/strfry/db/data.mdb
      STRFRY_POLICY_MAX_DB_BYTES: "${STRFRY_POLICY_MAX_DB_BYTES:-10737418240}"
      STRFRY_POLICY_MIN_FREE_BYTES: "${STRFRY_POLICY_MIN_FREE_BYTES:-26843545600}"
      STRFRY_POLICY_PUBKEY_CAPACITY: "30"
      STRFRY_POLICY_PUBKEY_RATE_PER_MINUTE: "2"
      STRFRY_POLICY_IP_CAPACITY: "100"
      STRFRY_POLICY_IP_RATE_PER_MINUTE: "10"
      STRFRY_POLICY_GLOBAL_CAPACITY: "200"
      STRFRY_POLICY_GLOBAL_RATE_PER_MINUTE: "20"
      STRFRY_POLICY_MAX_TRACKED_PUBKEYS: "10000"
      STRFRY_POLICY_MAX_TRACKED_SOURCES: "4096"
      # Budabit community write control (deploy/budabit/WRITE-CONTROL-PLAN.md).
      # Comma-separated exact 32222:<owner>:<communityId> addresses; empty disables the stage.
      BUDABIT_BRANCHES: "${BUDABIT_BRANCHES:-}"
      # Auto-host: also enforce every valid kind 32222 definition whose r tags name this
      # relay. Leave empty to enforce only BUDABIT_BRANCHES.
      BUDABIT_AUTO_HOST_URL: "${BUDABIT_AUTO_HOST_URL:-}"
      # passthrough (public relay, hosted communities enforced) or strict (community-only relay)
      BUDABIT_MODE: "${BUDABIT_MODE:-passthrough}"
      # 1 = log would-be rejections but accept everything (rollout)
      BUDABIT_DRY_RUN: "${BUDABIT_DRY_RUN:-0}"
      BUDABIT_REJECT_CENSORED_ADDRESSES: "${BUDABIT_REJECT_CENSORED_ADDRESSES:-0}"
      BUDABIT_RECONCILE_SECONDS: "${BUDABIT_RECONCILE_SECONDS:-300}"
      BUDABIT_STRFRY_BIN: /usr/local/bin/strfry
      # Both the Python mode AND core relay.readControl.enabled must agree.
      BUDABIT_READ_CONTROL: "${BUDABIT_READ_CONTROL:-off}"
      BUDABIT_READ_SNAPSHOT_PATH: "${BUDABIT_READ_SNAPSHOT_PATH:-/var/lib/strfry/db/budabit-readers.json}"
      BUDABIT_READ_MAX_PUBKEYS: "${BUDABIT_READ_MAX_PUBKEYS:-20000}"
      BUDABIT_READ_MAX_SNAPSHOT_BYTES: "${BUDABIT_READ_MAX_SNAPSHOT_BYTES:-2097152}"
      BUDABIT_READ_SCAN_MAX_BYTES: "${BUDABIT_READ_SCAN_MAX_BYTES:-33554432}"
      BUDABIT_READ_SCAN_TIMEOUT_SECONDS: "${BUDABIT_READ_SCAN_TIMEOUT_SECONDS:-30}"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 1280m
    cpus: 1.0
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -q -O /dev/null http://127.0.0.1:7777/
          && /usr/local/lib/strfry/write-policy.py --check-storage
          && /usr/local/lib/strfry/write-policy.py --check-policy
          && python3 /usr/local/lib/strfry/check-read-control.py --url http://127.0.0.1:7777/
          && { [ "$${BUDABIT_READ_CONTROL}" != members ] || /usr/local/lib/strfry/write-policy.py --check-read-policy; }
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 45s
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
